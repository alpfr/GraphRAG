name: Deploy to GCP GKE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: alpfr-splunk-integration
  GAR_LOCATION: us-central1 
  GKE_CLUSTER: graphrag-cluster    
  GKE_ZONE: us-central1-a
  REPOSITORY: graphrag-repo
  IMAGE: graphrag

jobs:
  setup-build-publish-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Use gcloud CLI
      run: gcloud info

    - name: Docker auth
      run: |-
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    - name: Build and Push Docker image
      run: |-
        docker build \
          -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
          -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest" \
          .
        docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
        docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

    - name: Deploy to Google Kubernetes Engine
      run: |-
        # Replace image placeholder
        sed -i "s|image: .*|image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}|g" k8s-gke/graphrag-deployment.yaml
        
        # Deploy Secrets
        echo "${{ secrets.K8S_SECRETS_GKE_YAML }}" | base64 --decode > k8s-gke/secrets.yaml
        kubectl apply -f k8s-gke/configmap.yaml -f k8s-gke/secrets.yaml
        
        # Deploy StatefulSets
        kubectl apply -f k8s-gke/opensearch-statefulset.yaml -f k8s-gke/neo4j-statefulset.yaml
        
        # Deploy App & Ingress
        kubectl apply -f k8s-gke/graphrag-deployment.yaml -f k8s-gke/ingress.yaml
