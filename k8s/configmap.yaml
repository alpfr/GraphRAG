apiVersion: v1
kind: ConfigMap
metadata:
  name: graphrag-config
  labels:
    app: graphrag
data:
  # Database Hosts
  OPENSEARCH_HOST: "opensearch-service"
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_USER: "admin"
  OPENSEARCH_INDEX_NAME: "graphrag-documents"
  
  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_USER: "neo4j"
  
  # LLM Routing
  LLM_PROVIDER: "ollama" # Reverted to strict Ollama execution per user directive
  OLLAMA_HOST: "http://ollama-service:11434"
  
  # Note: 
  # If LLM_PROVIDER is "ollama", you must provide an OLLAMA_HOST URL here.
  # Now using an in-cluster CPU-bound Ollama container.
