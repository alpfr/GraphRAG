apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphrag-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    # To use a managed certificate on Azure, see AGIC TLS configuration docs
    # appgw.ingress.kubernetes.io/appgw-ssl-certificate: "my-certificate"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: graphrag-frontend-service
            port:
              number: 80
