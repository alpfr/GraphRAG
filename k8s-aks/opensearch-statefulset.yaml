apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels:
    app: opensearch
spec:
  serviceName: "opensearch-service"
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      initContainers:
      # Increase vm.max_map_count for OpenSearch requirement
      - name: sysctl
        image: busybox
        command: ['sysctl', '-w', 'vm.max_map_count=262144']
        securityContext:
          privileged: true
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:2.12.0
        ports:
        - containerPort: 9200
          name: api
        - containerPort: 9600
          name: perf
        env:
        - name: discovery.type
          value: "single-node"
        - name: cluster.name
          value: "opensearch-cluster"
        - name: bootstrap.memory_lock
          value: "true"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: graphrag-secrets
              key: OPENSEARCH_PASSWORD
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: opensearch-data
          mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
  - metadata:
      name: opensearch-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "managed-premium" # Azure Premium SSD Managed Disk
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-service
spec:
  clusterIP: None # Headless service for StatefulSet
  ports:
  - port: 9200
    targetPort: 9200
    name: api
  selector:
    app: opensearch
