apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels:
    app: neo4j
spec:
  serviceName: "neo4j-service"
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
      - name: neo4j
        image: neo4j:5.18.0
        env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              name: graphrag-secrets
              key: NEO4J_PASSWORD
          # In K8s, Neo4j uses username/password combo format: neo4j/my-password
          # We'll use a wrapper script to combine user and secret
        command:
          - "/bin/sh"
          - "-c"
          - "export NEO4J_AUTH=neo4j/${NEO4J_AUTH}; /startup/docker-entrypoint.sh neo4j"
        ports:
        - containerPort: 7474
          name: http
        - containerPort: 7687
          name: bolt
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: neo4j-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: neo4j-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "managed-premium" # Azure Premium SSD Managed Disk
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
spec:
  ports:
  - port: 7474
    targetPort: 7474
    name: http
  - port: 7687
    targetPort: 7687
    name: bolt
  selector:
    app: neo4j
